name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Package VSIX
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npx --yes @vscode/vsce package --no-dependencies -o "epub-reader-${VERSION}.vsix"

      # Skipped automatically when the repository has no VSCE_PAT secret yet.
      - name: Publish to Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath epub-reader-*.vsix

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" epub-reader-*.vsix --generate-notes
